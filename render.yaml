# ClipKosh — one-click deployment for Render (free tier).
# Dashboard → New → Web Service → point it at this repo (or upload the folder).
# Render detects this file and uses the settings below.
services:
  - type: web
    name: clipkosh
    runtime: node
    plan: free
    rootDir: server
    buildCommand: bash render-build.sh
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Optional: override the public base URL used to build download links.
      # If left unset, the server derives it from each request's host.
      - key: BASE_URL
        sync: false
      # Puppeteer must find Chrome installed during build; point it at the
      # project-persistent cache so it survives into the runtime container.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/.cache/puppeteer
